name: Update package registries

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types:
      - release
      - tool_release
      - registry_update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      TOOLS_ORG: sstix-tools

    steps:
      - name: Check out registry repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            dpkg-dev \
            createrepo-c \
            reprepro \
            rpm \
            jq \
            gnupg

      - name: Run registry updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          python3 scripts/update_registry.py

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain registry/ flake.nix flake.lock)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit registry state
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add registry/ flake.nix
          if [ -f flake.lock ]; then
            git add flake.lock
          fi
          git commit -m "Update package registry [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4